<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- drop / water drop (Bautismos) -->
  <symbol id="icon-drop" viewBox="0 0 24 24">
    <path d="M12 2.5C12 2.5 5 10.2 5 14.5C5 18.09 8.13 21 12 21C15.87 21 19 18.09 19 14.5C19 10.2 12 2.5 12 2.5Z" fill="currentColor"/>
  </symbol>

  <!-- book-open (Lecciones) -->
  <symbol id="icon-book-open" viewBox="0 0 24 24">
    <path d="M12 6.5C10.5 5.4 8.5 4.8 6 4.8C4.3 4.8 2.8 5.1 1.5 5.7V19.2C2.8 18.6 4.3 18.3 6 18.3C8.5 18.3 10.5 18.9 12 20C13.5 18.9 15.5 18.3 18 18.3C19.7 18.3 21.2 18.6 22.5 19.2V5.7C21.2 5.1 19.7 4.8 18 4.8C15.5 4.8 13.5 5.4 12 6.5Z" fill="currentColor"/>
    <line x1="12" y1="6.5" x2="12" y2="20" stroke="white" stroke-width="1.5" fill="none"/>
  </symbol>

  <!-- user-plus (Referencias) -->
  <symbol id="icon-user-plus" viewBox="0 0 24 24">
    <circle cx="9" cy="8" r="4" fill="currentColor"/>
    <path d="M1 20C1 16.13 4.58 13 9 13C10.7 13 12.3 13.5 13.6 14.3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="18" y1="11" x2="18" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="15" x2="22" y2="15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </symbol>

  <!-- bank / building (Asistencia Sacramental) -->
  <symbol id="icon-bank" viewBox="0 0 24 24">
    <polygon points="12,2 22,8 2,8" fill="currentColor"/>
    <rect x="4" y="9" width="2.5" height="9" fill="currentColor"/>
    <rect x="8.75" y="9" width="2.5" height="9" fill="currentColor"/>
    <rect x="13.5" y="9" width="2.5" height="9" fill="currentColor"/>
    <rect x="18" y="9" width="2.5" height="9" fill="currentColor"/>
    <rect x="2" y="19" width="20" height="2.5" fill="currentColor"/>
  </symbol>

  <!-- user-circle (Lider Misional) -->
  <symbol id="icon-user-circle" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="currentColor"/>
    <circle cx="12" cy="10" r="3.5" fill="white"/>
    <path d="M5.5 20C6.5 16.8 9 14.8 12 14.8C15 14.8 17.5 16.8 18.5 20" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </symbol>

  <!-- users (QE / Soc. Socorro) -->
  <symbol id="icon-users" viewBox="0 0 24 24">
    <circle cx="9" cy="8" r="3.5" fill="currentColor"/>
    <path d="M1.5 20C1.5 16.4 4.9 13.5 9 13.5C13.1 13.5 16.5 16.4 16.5 20Z" fill="currentColor"/>
    <circle cx="17" cy="7" r="2.8" fill="currentColor"/>
    <path d="M19.5 19.5C19.5 16.8 18.1 14.5 16 13.7C16.5 13.6 17 13.5 17.5 13.5C20.5 13.5 22.8 15.7 22.8 18.4V19.5H19.5Z" fill="currentColor"/>
  </symbol>

  <!-- house (Misioneros Barrio) -->
  <symbol id="icon-house" viewBox="0 0 24 24">
    <path d="M3 10.5L12 3L21 10.5V21H15V15H9V21H3V10.5Z" fill="currentColor"/>
  </symbol>

  <!-- lightning / bolt (Jovenes Lideres) -->
  <symbol id="icon-lightning" viewBox="0 0 24 24">
    <polygon points="13,2 5,13 11,13 11,22 19,11 13,11" fill="currentColor"/>
  </symbol>

  <!-- calendar-blank (Coord. Misional) -->
  <symbol id="icon-calendar-blank" viewBox="0 0 24 24">
    <rect x="2" y="5" width="20" height="17" rx="2" fill="currentColor"/>
    <rect x="2" y="5" width="20" height="6.5" rx="2" fill="currentColor" opacity="0.85"/>
    <rect x="2" y="8.5" width="20" height="3" fill="currentColor"/>
    <line x1="7" y1="2" x2="7" y2="7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="17" y1="2" x2="17" y2="7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="5" y="13" width="3" height="3" rx="0.5" fill="white" opacity="0.7"/>
    <rect x="10.5" y="13" width="3" height="3" rx="0.5" fill="white" opacity="0.7"/>
    <rect x="16" y="13" width="3" height="3" rx="0.5" fill="white" opacity="0.7"/>
  </symbol>

  <!-- map-trifold (Logo / Navbar) -->
  <symbol id="icon-map-trifold" viewBox="0 0 24 24">
    <path d="M2 5L9 2L15 5L22 2V19L15 22L9 19L2 22V5Z" fill="currentColor"/>
    <line x1="9" y1="2" x2="9" y2="19" stroke="white" stroke-width="1.5"/>
    <line x1="15" y1="5" x2="15" y2="22" stroke="white" stroke-width="1.5"/>
  </symbol>

  <!-- info (Info button) -->
  <symbol id="icon-info" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="currentColor"/>
    <circle cx="12" cy="8" r="1.3" fill="white"/>
    <rect x="10.75" y="11" width="2.5" height="6" rx="1.25" fill="white"/>
  </symbol>

  <!-- download-simple (Exportar PDF) -->
  <symbol id="icon-download-simple" viewBox="0 0 24 24">
    <path d="M12 3V15.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M7 11L12 16L17 11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M3 18V20C3 20.55 3.45 21 4 21H20C20.55 21 21 20.55 21 20V18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </symbol>

  <!-- plus (Nueva Accion) -->
  <symbol id="icon-plus" viewBox="0 0 24 24">
    <line x1="12" y1="4" x2="12" y2="20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </symbol>

  <!-- trash (Eliminar accion) -->
  <symbol id="icon-trash" viewBox="0 0 24 24">
    <path d="M4 7H20L18.5 21H5.5L4 7Z" fill="currentColor"/>
    <path d="M8 5C8 3.9 8.9 3 10 3H14C15.1 3 16 3.9 16 5V7H8V5Z" fill="currentColor"/>
    <line x1="2" y1="7" x2="22" y2="7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="9" y1="11" x2="9.5" y2="17" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="12" y1="11" x2="12" y2="17" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="15" y1="11" x2="14.5" y2="17" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <!-- check (Buttons confirm) -->
  <symbol id="icon-check" viewBox="0 0 24 24">
    <polyline points="4,13 9,18 20,7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </symbol>

  <!-- x / close (Modal close) -->
  <symbol id="icon-x" viewBox="0 0 24 24">
    <line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </symbol>


  <!-- file-pdf (Exportar PDF in modals) -->
  <symbol id="icon-file-pdf" viewBox="0 0 24 24">
    <path d="M4 2H14L20 8V22H4V2Z" fill="currentColor"/>
    <path d="M14 2V8H20" fill="none" stroke="white" stroke-width="1.5"/>
    <text x="12" y="17" text-anchor="middle" font-size="6" font-weight="800" fill="white" font-family="sans-serif">PDF</text>
  </symbol>

  <!-- heart (JustServe) -->
  <symbol id="icon-heart" viewBox="0 0 24 24">
    <path d="M12 21C12 21 3 14.5 3 8.5C3 5.42 5.42 3 8.5 3C10.24 3 11.81 3.85 12 5C12.19 3.85 13.76 3 15.5 3C18.58 3 21 5.42 21 8.5C21 14.5 12 21 12 21Z" fill="currentColor"/>
  </symbol>

  <!-- share-network (Referencias) -->
  <symbol id="icon-share-network" viewBox="0 0 24 24">
    <circle cx="18" cy="5" r="3" fill="currentColor"/>
    <circle cx="6" cy="12" r="3" fill="currentColor"/>
    <circle cx="18" cy="19" r="3" fill="currentColor"/>
    <line x1="8.7" y1="10.7" x2="15.3" y2="6.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="8.7" y1="13.3" x2="15.3" y2="17.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>

</svg>
